name: Auto Publish Reels to Facebook

on:
  schedule:
    # الساعة 3:15 عصراً بتوقيت العراق (UTC+3) - ذروة العصر
    - cron: '15 12 * * *'
    # الساعة 9:15 مساءً بتوقيت العراق (UTC+3) - ذروة المساء
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'توليد الفيديو للمعاينة فقط (بدون نشر على فيسبوك)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-publish-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cairo, FFmpeg and Python dependencies
        run: |
          sudo apt-get update -o Acquire::http::Timeout="15" -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libcairo2-dev pkg-config
          pip install --upgrade pip -q
          pip install -q requests pillow edge-tts pycairo arabic-reshaper python-bidi

      - name: Generate and Publish Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            python publish_reel.py --local
          else
            python publish_reel.py
          fi

      - name: Save published history
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f published_history.json ]; then
            git add published_history.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update published history [skip ci]"
              git pull --rebase origin ${{ github.ref_name }}
              git push
            fi
          fi

      - name: Upload video and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-output-${{ github.run_number }}
          path: |
            exports/final.mp4
            stickman_build/qa-report.md
          retention-days: 3
          if-no-files-found: ignore
